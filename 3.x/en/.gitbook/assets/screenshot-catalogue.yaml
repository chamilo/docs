# Screenshot catalogue for the 3.x English documentation.
#
# Maps every screenshot in this space back to the my.chamilo.net page (and, where
# relevant, the exact steps/data state) it depicts, so the same screenshot can be
# faithfully reproduced in another language via the localize-screenshots skill.
#
# UPDATE THIS FILE whenever you add a genuinely new screenshot to the English
# documentation (see /var/www/chamilo/master/CLAUDE.md, "Documentation screenshots"
# section, for the authoring-side instruction that points back here).
#
# Fields per entry:
#   file        - filename in .gitbook/assets/, matches the language-neutral name
#                 reused (once translated) in every other 3.x/<lang>/.gitbook/assets/
#   doc_page    - the English markdown page that references it, relative to 3.x/en/
#   alt         - the image's alt text in the English markdown, used as the
#                 human-readable description (and as the first thing to check when
#                 reconstructing url/steps from scratch)
#   url         - the my.chamilo.net path (relative, no host) that shows this page,
#                 or null if not yet reconstructed
#   role        - the account role/type needed to reach it (admin, teacher, student),
#                 or null if not yet reconstructed
#   steps       - any interaction needed beyond navigating to `url` (opening a
#                 dialog, having specific demo data present, etc.), or null
#   confidence  - one of:
#                   verified              - reproduced live and visually confirmed
#                   inferred (...)        - route/steps found in the app's source
#                                           (e.g. assets/vue/router/*.js) but not
#                                           yet reproduced live - double-check before
#                                           trusting it for a real screenshot pass
#                   unreconstructed       - alt text and doc_page only; url/role/steps
#                                           still need figuring out (read the doc
#                                           page's surrounding prose, then the app's
#                                           router, then navigate live to confirm)
#
# Chamilo's own profile-language codes (the #profile_locale <select> on
# /account/edit) do NOT match GitBook's language codes used elsewhere in this repo.
# Notable mappings needed when localizing screenshots:
#   fr -> fr_FR   de -> de      es -> es      it -> it       nl -> nl
#   pt -> pt_PT   pt-br -> pt_BR   ar -> ar    el -> el       id -> id_ID
#   ja -> ja      zh -> zh_CN   zh-tw -> zh_TW   da -> da     sv -> sv_SE
#   fi -> fi_FI   no -> nb_NO (Norsk bokmål - GitBook's generic "no" has no exact
#                 Chamilo match; nb_NO is the closest and most common written form)
# 1.11.x/ga/ is mislabeled: Chamilo's real "ga" is Gaeilge (Irish); that content is
# actually Galego (Galician), Chamilo's "gl".
