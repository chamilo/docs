# Site-wide Git Sync config for the `all` branch, which holds every Chamilo
# documentation version and language as its own space, laid out on disk as
# <version>/<language>/ (e.g. `2.x/fr/`, `3.x/en/`). Each such directory is a
# self-contained GitBook space with its own `.gitbook.yaml`, `README.md` and
# `SUMMARY.md` - see that directory's `.gitbook.yaml` for its own settings.
#
# `.gitbook/assets/` lives INSIDE each space directory (e.g. `2.x/fr/.gitbook/assets/`).
# GitBook does not support a shared/central assets folder across mapped space
# directories, so each space carries its own copy - this is why the same
# screenshot can appear once per language under a given version.
#
# Do not add a `content.directory` that lives outside this branch's own tree.
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Chamilo Documentation
  structure:
    - type: section
      key: section-1.11.x
      title: 1.11.x
      path: 1.11.x
      children:
        - type: space
          key: space-1.11.x-en
          title: English
          path: en
          default: true
          content:
            directory: ./1.11.x/en
            language: en
        - type: space
          key: space-1.11.x-fr
          title: Français
          path: fr
          content:
            directory: ./1.11.x/fr
            language: fr
        - type: space
          key: space-1.11.x-es
          title: Español
          path: es
          content:
            directory: ./1.11.x/es
            language: es
        - type: space
          key: space-1.11.x-de
          title: Deutsch
          path: de
          content:
            directory: ./1.11.x/de
            language: de
        - type: space
          key: space-1.11.x-nl
          title: Nederlands
          path: nl
          content:
            directory: ./1.11.x/nl
            language: nl
        - type: space
          key: space-1.11.x-ga
          title: Galego
          path: ga
          content:
            directory: ./1.11.x/ga
            # Galician has no code in GitBook's supported language list,
            # so `language` is intentionally left unset for this space.
        - type: space
          key: space-1.11.x-pt-br
          title: Português (Brasil)
          path: pt-br
          content:
            directory: ./1.11.x/pt-br
            language: pt-br
